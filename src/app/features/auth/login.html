<app-auth-window title="Lambda Quality">
  <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading()">
    <div class="window-body">
      <h1 class="system-name sr-only">Lambda Quality</h1>
      <p class="system-subtitle">Sistema de Gestão da Qualidade de Software</p>
      @if (notice.message()) {
        <p class="message success" role="status">{{ notice.message() }}</p>
      }
      @if (error()) {
        <p class="message error" role="alert">{{ error() }}</p>
      }
      <div class="field">
        <label for="email">E-mail:</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          maxlength="254"
          [readOnly]="loading()"
          [attr.aria-invalid]="!!fieldError('email')"
          aria-describedby="email-error"
        />
        <span class="field-error" id="email-error">{{ fieldError('email') }}</span>
      </div>
      <div class="field">
        <label for="password">Senha:</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          maxlength="128"
          [readOnly]="loading()"
          [attr.aria-invalid]="!!fieldError('password')"
          aria-describedby="password-error"
        />
        <span class="field-error" id="password-error">{{ fieldError('password') }}</span>
      </div>
      <div class="auth-links">
        <a routerLink="/cadastro">Criar conta</a
        ><a routerLink="/recuperar-senha">Esqueci minha senha</a>
      </div>
    </div>
    <footer class="window-footer">
      @if (wait()) {
        <span role="status">Aguarde {{ wait() }}s</span>
      }
      <button class="btn btn-primary" type="submit" [disabled]="loading() || !!wait()">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </footer>
  </form>
</app-auth-window>
@if (cookieNoticeOpen()) {
  <app-cookie-notice (closed)="cookieNoticeOpen.set(false)" />
}
